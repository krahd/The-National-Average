name: Temporary NeurIPS latent-world thumbnail audit

on:
  push:
    paths:
      - '.github/workflows/temporary-neurips-latent-world-thumbnail.yml'
  workflow_dispatch:

jobs:
  render-thumbnail-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install renderer and foundation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -e '.[foundation]'
      - name: Render source-faithful low-FPS audit film
        run: |
          python scripts/render_latent_flight.py \
            --preset production \
            --width 960 --height 540 --fps 1 --duration 96 \
            --foundation required --seed 20260810 --no-audio \
            --out-dir outputs/video/thumbnail-audit
      - name: Extract candidate stills
        run: |
          set -euo pipefail
          mkdir -p thumbnail-candidates
          MOV='outputs/video/thumbnail-audit/the_national_average_latent_world.mp4'
          for T in 18 32 46 60 72 84 91; do
            ffmpeg -loglevel error -ss "$T" -i "$MOV" -frames:v 1 "thumbnail-candidates/frame-${T}s.png"
          done
          sha256sum thumbnail-candidates/*.png > thumbnail-candidates/SHA256SUMS.txt
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$MOV" > thumbnail-candidates/AUDIT-DURATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neurips-latent-world-thumbnail-candidates
          path: thumbnail-candidates/
