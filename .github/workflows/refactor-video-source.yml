name: Preserve and refactor video source

on:
  push:
    paths:
      - '.github/workflows/refactor-video-source.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refactor venue-specific video code into canonical project source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil

          root = Path('.')

          # Canonical, venue-neutral entry points.
          renames = {
              Path('scripts/render_eccv_video.py'): Path('scripts/render_video.py'),
              Path('scripts/prepare_eccv_assets.py'): Path('scripts/prepare_video_assets.py'),
          }
          for old, new in renames.items():
              if old.exists():
                  new.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(old), str(new))

          legacy_reexport = Path('src/tna/video/eccv.py')
          if legacy_reexport.exists():
              legacy_reexport.unlink()

          # Remove venue-specific terminology and standardise the moving-image
          # manifestation under the project title.
          replacements = [
              ('ECCVRenderConfig', 'VideoRenderConfig'),
              ('ECCVFrameRenderer', 'VideoFrameRenderer'),
              ('render_eccv_video', 'render_video'),
              ('prepare_eccv_assets', 'prepare_video_assets'),
              ('The Average Nation', 'The National Average'),
              ('the_average_nation', 'the_national_average'),
              ('AVERAGE-NATION.PROC', 'NATIONAL-AVERAGE.PROC'),
              ('+eccv-video', '+moving-image-v1'),
              ('outputs/eccv/', 'outputs/video/'),
              ('ECCV', 'video'),
              ('eccv', 'video'),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == Path('.github/workflows/refactor-video-source.yml'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Venue-neutral production language in the renderer itself.
          video_files = [
              Path('src/tna/video/pipeline.py'),
              Path('src/tna/video/foundation.py'),
              Path('src/tna/video/compositor.py'),
              Path('src/tna/video/scenes.py'),
              Path('scripts/verify_analysis.py'),
          ]
          for path in video_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('write_submission_docs', 'write_render_notes')
              text = text.replace('technical_statement.md', 'render_notes.md')
              text = text.replace('submission', 'production')
              text = text.replace('Submission', 'Production')
              path.write_text(text, encoding='utf-8')

          # Canonical render preset. This preserves the parameters of the
          # recovered three-minute render while allowing subsequent versions.
          preset = {
              'schema_version': 1,
              'artwork': 'The National Average',
              'status': 'work-in-progress',
              'snapshot': 'video-2026-v1',
              'created': '2026-08-07',
              'models': {
                  'clip': 'openai/clip-vit-base-patch32',
                  'sdvae': 'stabilityai/sd-vae-ft-mse',
                  'revision_policy': 'Resolved model snapshot revisions are recorded in provenance/model_manifest.json at render time.'
              },
              'preview': {
                  'width': 960,
                  'height': 540,
                  'fps': 12,
                  'duration': 180.0,
                  'foundation': 'auto',
                  'seed': 20260613,
                  'audio': True,
                  'provenance_overlay': False
              },
              'production': {
                  'width': 1920,
                  'height': 1080,
                  'fps': 24,
                  'duration': 180.0,
                  'foundation': 'required',
                  'seed': 20260613,
                  'audio': True,
                  'provenance_overlay': False
              }
          }
          presets = Path('presets')
          presets.mkdir(exist_ok=True)
          (presets / 'video-2026.json').write_text(json.dumps(preset, indent=2) + '\n', encoding='utf-8')

          # Canonical rendering entry point: presets are data, not hidden CLI defaults.
          Path('scripts/render_video.py').write_text('''#!/usr/bin/env python3
          """Render the moving-image work for The National Average."""

          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path

          from tna.video import VideoRenderConfig, render_video


          DEFAULT_OUT_DIR = Path("outputs/video/the_national_average")
          DEFAULT_PRESET_FILE = Path("presets/video-2026.json")


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description="Render The National Average moving-image work.")
              parser.add_argument("--preset", choices=["preview", "production"], default="preview")
              parser.add_argument("--preset-file", type=Path, default=DEFAULT_PRESET_FILE)
              parser.add_argument("--out-dir", type=Path, default=DEFAULT_OUT_DIR)
              parser.add_argument("--width", type=int, default=None)
              parser.add_argument("--height", type=int, default=None)
              parser.add_argument("--fps", type=int, default=None)
              parser.add_argument("--duration", type=float, default=None)
              parser.add_argument("--foundation", choices=["required", "auto", "off"], default=None)
              parser.add_argument("--seed", type=int, default=None)
              parser.add_argument("--keep-frames", action="store_true")
              parser.add_argument("--no-audio", action="store_true")
              parser.add_argument("--provenance-overlay", action="store_true")
              return parser


          def load_preset(path: Path, name: str) -> dict[str, object]:
              payload = json.loads(path.read_text(encoding="utf-8"))
              values = payload.get(name)
              if not isinstance(values, dict):
                  raise SystemExit(f"Preset {name!r} not found in {path}")
              return values


          def main() -> None:
              args = build_parser().parse_args()
              preset = load_preset(args.preset_file, args.preset)
              config = VideoRenderConfig(
                  out_dir=args.out_dir,
                  width=args.width if args.width is not None else int(preset["width"]),
                  height=args.height if args.height is not None else int(preset["height"]),
                  fps=args.fps if args.fps is not None else int(preset["fps"]),
                  duration=args.duration if args.duration is not None else float(preset["duration"]),
                  foundation=args.foundation if args.foundation is not None else str(preset["foundation"]),
                  seed=args.seed if args.seed is not None else int(preset["seed"]),
                  keep_frames=args.keep_frames,
                  preset=args.preset,
                  audio=bool(preset.get("audio", True)) and not args.no_audio,
                  provenance_overlay=bool(preset.get("provenance_overlay", False)) or args.provenance_overlay,
              )
              result = render_video(config)
              print(json.dumps(result, indent=2))


          if __name__ == "__main__":
              main()
          '''.replace('          ', ''), encoding='utf-8')

          Path('scripts/prepare_video_assets.py').write_text('''#!/usr/bin/env python3
          """Prepare the foundation-model assets used by the video renderer."""

          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path

          from tna.video.foundation import FoundationAssetError, prepare_foundation_assets


          DEFAULT_OUT_DIR = Path("outputs/video/the_national_average")


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description="Download and verify foundation-model assets for the video.")
              parser.add_argument("--out-dir", type=Path, default=DEFAULT_OUT_DIR)
              parser.add_argument("--local-files-only", action="store_true", help="Verify only existing Hugging Face cache files.")
              parser.add_argument("--optional", action="store_true", help="Write a manifest but do not fail if models are missing.")
              return parser


          def main() -> None:
              args = build_parser().parse_args()
              try:
                  manifest = prepare_foundation_assets(
                      args.out_dir,
                      required=not args.optional,
                      local_files_only=args.local_files_only,
                  )
              except FoundationAssetError as exc:
                  raise SystemExit(str(exc)) from exc
              print(json.dumps(manifest, indent=2))


          if __name__ == "__main__":
              main()
          '''.replace('          ', ''), encoding='utf-8')

          Path('src/tna/video/__init__.py').write_text('''"""Moving-image production for The National Average.

          ``pipeline`` generates analysis-derived assets and provenance, ``scenes``
          renders frames, and ``compositor`` performs final frame/audio composition.
          """

          from .foundation import prepare_foundation_assets
          from .pipeline import VideoRenderConfig, render_video

          __all__ = ["VideoRenderConfig", "prepare_foundation_assets", "render_video"]
          '''.replace('          ', ''), encoding='utf-8')

          # Public documentation: the video is an active artwork component, not
          # disposable venue infrastructure.
          docs = Path('docs')
          docs.mkdir(exist_ok=True)
          Path('docs/video.md').write_text('''# Moving-image work

          **Status: active, work in progress (August 2026).**

          The National Average includes an ongoing moving-image work generated from the same corpus, weighting operations, representation spaces, and analysis records as the rest of the project. It is not tied to a particular venue. The present source is a working baseline for continued artistic development and future exhibition or submission.

          The renderer is part of the artwork's source. Rendered MP4 files are derivative outputs; losing a rendered master must never imply losing the system that produced it.

          ## Canonical source

          The moving-image source is distributed across:

          - `src/tna/video/pipeline.py`: asset generation, orchestration, provenance, and render configuration;
          - `src/tna/video/scenes.py`: frame and scene construction;
          - `src/tna/video/compositor.py`: frame composition and ffmpeg integration;
          - `src/tna/video/effects.py`: image effects;
          - `src/tna/video/audio.py`: data-driven soundtrack generation;
          - `src/tna/video/foundation.py`: foundation-model preparation and model-manifest provenance;
          - `src/tna/analysis/`: measurements and records displayed by the moving image;
          - `scripts/render_video.py`: canonical command-line rendering entry point;
          - `scripts/prepare_video_assets.py`: model-asset preparation;
          - `presets/video-2026.json`: versioned render parameters.

          None of these files should be treated as temporary application or submission material.

          ## Reproducing the current baseline

          Install the project and development dependencies:

          ```bash
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
          ```

          Install the foundation-model dependencies for a full production render:

          ```bash
          pip install -e ".[foundation]"
          python scripts/prepare_video_assets.py
          ```

          Render a lower-resolution working version:

          ```bash
          python scripts/render_video.py --preset preview
          ```

          Render the preserved production baseline:

          ```bash
          python scripts/render_video.py --preset production
          ```

          The `production` configuration in `presets/video-2026.json` records the recovered three-minute baseline: 1920×1080, 24 fps, 180 seconds, deterministic seed `20260613`, with CLIP and Stable-Diffusion-VAE representations required. The `preview` configuration uses the same duration and seed at lower spatial and temporal resolution and permits unavailable foundation models.

          Command-line options can override individual preset values for experiments without altering the preserved baseline.

          ## Epistemic invariant

          The audiovisual system distinguishes analytical quantities from visual treatment. Values shown as measurements, rankings, residuals, saliency, embedding relations, contribution shares, or retrieval results must originate in computed analysis records. The renderer may animate, compose, grade, or distort imagery, but it must not fabricate values presented as analysis.

          `src/tests/test_no_fabrication.py` guards this distinction. `src/tests/test_video_smoke.py` exercises the render chain at very low resolution so that changes to dependencies, imports, paths, scene code, or ffmpeg integration cannot silently make the artwork unrenderable.

          ## Outputs and preservation

          Generated material belongs under `outputs/video/` and is not source. Each render writes its video, stills, generated analytical assets, and provenance records into its output directory. Model snapshot revisions are recorded in `provenance/model_manifest.json` when foundation assets are prepared.

          Large rendered masters should not be committed to ordinary Git history. Meaningful finished or submitted versions should be attached to a GitHub Release or another archival store, while the exact source state and render preset remain tagged in Git. The baseline established here is tagged `video-2026-v1`; subsequent materially distinct versions should receive new tags rather than overwriting this one.

          ## Development direction

          The moving-image work remains open. Its present renderer should be understood as material for further artistic development rather than a finished or venue-specific edition. Future changes may alter pacing, scene structure, sound, representational spaces, or visual language, but should preserve explicit provenance and the ability to reconstruct earlier tagged versions.
          '''.replace('          ', ''), encoding='utf-8')

          # End-to-end regression test. It skips only when ffmpeg is genuinely
          # unavailable; CI installs ffmpeg explicitly below.
          Path('src/tests/test_video_smoke.py').write_text('''from __future__ import annotations

          from pathlib import Path
          import shutil

          import pytest

          from tna.video import VideoRenderConfig, render_video


          def test_video_render_chain(tmp_path: Path) -> None:
              if shutil.which("ffmpeg") is None:
                  pytest.skip("ffmpeg is required for the end-to-end video smoke test")

              out_dir = tmp_path / "video"
              config = VideoRenderConfig(
                  out_dir=out_dir,
                  width=192,
                  height=108,
                  fps=2,
                  duration=1.0,
                  foundation="off",
                  seed=20260613,
                  keep_frames=False,
                  preset="preview",
                  audio=False,
              )
              result = render_video(config)

              video = Path(result["video"])
              provenance = Path(result["provenance"])
              manifest = Path(result["asset_manifest"])

              assert video.is_file() and video.stat().st_size > 0
              assert provenance.is_file() and provenance.stat().st_size > 0
              assert manifest.is_file() and manifest.stat().st_size > 0
          '''.replace('          ', ''), encoding='utf-8')

          # README: explicitly record the active status and preservation policy.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Audiovisual work\n\n'
          status = (
              '**Status: active, work in progress (August 2026).** The moving-image work is an ongoing '
              'manifestation of The National Average and is being developed independently of any particular venue. '
              'Its renderer and versioned presets are canonical artwork source, not disposable production infrastructure. '
              'See [`docs/video.md`](docs/video.md) for reproduction and preservation details.\n\n'
          )
          if marker in text and status not in text:
              text = text.replace(marker, marker + status, 1)

          old = '| `scripts/verify_analysis.py` | independent checks of analysis records and invariants |\n'
          new = (
              '| `scripts/verify_analysis.py` | independent checks of analysis records and invariants |\n'
              '| `presets/video-2026.json` | preserved preview and production render settings |\n'
              '| `docs/video.md` | moving-image status, reproduction, provenance, and preservation policy |\n'
          )
          if old in text and '`presets/video-2026.json`' not in text:
              text = text.replace(old, new, 1)

          structure_marker = '| `src/tna/video/` | audiovisual production pipeline |\n'
          structure_new = (
              '| `src/tna/video/` | moving-image source: orchestration, scenes, composition, effects, and sound |\n'
              '| `scripts/render_video.py` | canonical moving-image rendering entry point |\n'
              '| `presets/video-2026.json` | versioned moving-image render settings |\n'
              '| `docs/video.md` | moving-image documentation and preservation policy |\n'
          )
          if structure_marker in text:
              text = text.replace(structure_marker, structure_new, 1)

          render_note = '''\nRender the moving-image work from its versioned preset:\n\n```bash\npython scripts/render_video.py --preset preview\npython scripts/render_video.py --preset production\n```\n\n'''
          outputs_marker = '## Outputs and provenance\n'
          if outputs_marker in text and 'python scripts/render_video.py --preset production' not in text:
              text = text.replace(outputs_marker, render_note + outputs_marker, 1)

          readme.write_text(text, encoding='utf-8')

          # Version bump: this removes the venue-specific public API and adds a
          # canonical moving-image interface and documented preset.
          pyproject = Path('pyproject.toml')
          ptext = pyproject.read_text(encoding='utf-8').replace('version = "2.1.0"', 'version = "2.2.0"')
          pyproject.write_text(ptext, encoding='utf-8')
          init = Path('src/tna/__init__.py')
          if init.exists():
              itext = init.read_text(encoding='utf-8').replace('__version__ = "2.1.0"', '__version__ = "2.2.0"')
              init.write_text(itext, encoding='utf-8')

          # The one-shot workflow removes itself from the resulting source tree.
          Path('.github/workflows/refactor-video-source.yml').unlink()
          PY

      - name: Verify venue terminology is absent
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.svg' '(ECCV|eccv)' .; then
            echo 'Venue-specific terminology remains in the current tree.' >&2
            exit 1
          fi

      - name: Install test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile and test
        shell: bash
        run: |
          python -m compileall -q src scripts
          pytest -q src/tests/test_no_fabrication.py src/tests/test_video_smoke.py
          pytest -q src/tests

      - name: Commit canonical video source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make moving-image work a first-class project component'
          git push origin HEAD:main

          for tag in v2.2.0 video-2026-v1; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists; leaving it unchanged."
            else
              git tag -a "${tag}" -m "The National Average ${tag}: canonical moving-image work-in-progress source"
              git push origin "${tag}"
            fi
          done
