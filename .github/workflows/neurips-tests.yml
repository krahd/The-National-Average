name: NeurIPS lightweight tests

on:
  push:
    paths:
      - "src/tna/video/neurips*.py"
      - "src/tests/test_neurips*.py"
      - ".github/workflows/neurips-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src/tna/video scripts
      - run: pytest -q src/tests/test_neurips_metrics.py src/tests/test_neurips_video.py
