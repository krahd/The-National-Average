[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-national-average"
version = "2.1.0"
description = "Research project and artwork on critical averaging, statistical representation, and national symbols."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "cairosvg>=2.5",
  "numpy>=1.21",
  "Pillow>=9.0",
  "matplotlib>=3.4",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
]
foundation = [
  "diffusers>=0.30",
  "transformers>=4.45",
  "accelerate>=0.33",
]
diagnostics = [
  "scikit-learn>=1.3",
  "umap-learn>=0.5",
]
dev = [
  "pytest>=8",
]

[project.scripts]
tna = "tna.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
